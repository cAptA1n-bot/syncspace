version: '3.8'

services:
  # ─── MongoDB Database ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: syncspace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "localhost:27017/test", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - syncspace-network

  # ─── Backend API & Collaboration Server ─────────────────────────────────────
  backend:
    build:
      context: ./SyncSpace/backend
      dockerfile: Dockerfile
    container_name: syncspace-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/syncspace
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=production_jwt_secret_change_me_to_at_least_64_characters_long
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      # - AI_PROVIDER=gemini
      # - AI_API_KEY=your_gemini_api_key_here
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - syncspace-network

  # ─── Frontend Next.js Client ────────────────────────────────────────────────
  frontend:
    build:
      context: ./SyncSpace/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
    container_name: syncspace-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5173
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - syncspace-network

volumes:
  mongo_data:
    driver: local

networks:
  syncspace-network:
    driver: bridge

